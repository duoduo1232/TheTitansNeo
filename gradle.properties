# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# 26.1.2 起官方不再混淆，NeoForge 也是官方名，两边都不需要 remap。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# 版本出处: https://projects.neoforged.net/neoforged/neoforge
neo_version=26.1.2.109
# FML 在 26.1.2 对应的 loader 版本范围
loader_version_range=[11,)

# Mod Properties
mod_id=thetitansneo
mod_name=The Titans Neo
mod_license=All Rights Reserved
mod_version=1.0.8
mod_group_id=net.byAqua3.thetitansneo
mod_authors=Aqua3
mod_description=The Titans, ported to NeoForge 26.1.2.
